name: Corrigir Temporadas e Converter HTML

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Corrigir e Converter
        run: |
          cat > script.py << 'PYEOF'
          import json
          import re
          from pathlib import Path

          def processar(caminho):
              try:
                  texto = caminho.read_text(encoding='utf-8-sig')
                  if texto.strip().lower().startswith('<!doctype'):
                      match = re.search(r'<script type="application/ld\+json">(.*?)</script>', texto, re.S)
                      if not match: return False
                      texto = match.group(1)
                      
                  dados = json.loads(texto)
                  nome = dados.get('name', '').replace(' - 🍿Clau', '').replace(' - Clau', '').strip()
                  
                  s, e, titulo, serie = 1, None, "", nome
                  m1 = re.match(r'^(.*?)\s*-\s*T(\d+)E(\d+)\s*(?:-\s*(.*))?$', nome, re.I)
                  m2 = re.match(r'^(.*?)\s*-\s*(?:Episódio|Episodio)\s*(\d+)\s*(?:-\s*(.*))?$', nome, re.I)
                  
                  if m1:
                      serie, s, e, titulo = m1.group(1).strip(), int(m1.group(2)), int(m1.group(3)), (m1.group(4) or "").strip()
                  elif m2:
                      serie, e, titulo = m2.group(1).strip(), int(m2.group(2)), (m2.group(3) or "").strip()
                      
                  if e is not None:
                      dados['name'] = f"{serie} - T{s}E{e}" + (f" - {titulo}" if titulo else "") + " - 🍿Clau"
                      dados['@type'] = "TVEpisode"
                      dados['episodeNumber'] = e
                      dados['partOfSeason'] = {"@type": "TVSeason", "seasonNumber": s}
                      dados['partOfSeries'] = {"@type": "TVSeries", "name": serie}
                  else:
                      dados['name'] = f"{nome} - 🍿Clau"
                      
                  capa = dados.get('thumbnailUrl', [''])[0]
                  if not capa:
                      capa = 'https://via.placeholder.com/500x750?text=Sem+Capa'
                      
                  json_final = json.dumps(dados, ensure_ascii=False)
                  
                  html = '<!DOCTYPE html>\n<html lang="pt-BR">\n<head>\n<script type="application/ld+json">\n' + json_final + '\n</script>\n<title>' + dados['name'] + '</title>\n<meta charset="UTF-8">\n</head>\n<body>\n<img src="' + capa + '" style="width:100%;max-height:220px;object-fit:cover;">\n<h1>' + dados['name'] + '</h1>\n</body>\n</html>'
                  
                  caminho.write_text(html, encoding='utf-8')
                  return True
              except Exception as ex:
                  print(f"Erro em {caminho.name}: {ex}")
                  return False

          cont = 0
          for arq in Path('.').glob('*.json'):
              if processar(arq):
                  cont += 1
                  
          print(f"Arquivos processados: {cont}")
          PYEOF

          python3 script.py

          git config user.name "Claudineybr"
          git config user.email "Claudineybr@users.noreply.github.com"
          git add .
          git commit -m "fix: HTML + Temporadas + Episodios" || echo "Nada para commitar"
          git push origin HEAD:main
