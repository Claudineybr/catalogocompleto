name: Gerar CSV do Catalogo

on:
  schedule:
    - cron: '0 */12 * * *' # Roda a cada 12 horas (00:00 e 12:00 UTC)
  workflow_dispatch:      # Permite rodar manualmente

permissions:
  contents: write

jobs:
  gerar-csv:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v5

      - name: Extrair dados e criar CSV
        run: |
          cat > gerar_csv.py << 'PYEOF'
          import json
          import re
          import csv
          from pathlib import Path

          arquivo_csv = Path('catalogo.csv')
          total = 0
          
          print("Iniciando extração dos dados...")
          
          with open(arquivo_csv, 'w', newline='', encoding='utf-8-sig') as f:
              writer = csv.writer(f, delimiter=';')
              # Cria o cabeçalho
              writer.writerow(['Nome', 'Link'])
              
              for arq in Path('.').glob('*.json'):
                  try:
                      texto = arq.read_text(encoding='utf-8-sig')
                      
                      # Extrai o bloco JSON-LD de dentro do HTML
                      match = re.search(r'<script type="application/ld\+json">(.*?)</script>', texto, re.S)
                      if not match:
                          continue
                          
                      dados = json.loads(match.group(1))
                      nome = dados.get('name', '').strip()
                      link = dados.get('contentUrl', '').strip()
                      
                      if nome and link:
                          writer.writerow([nome, link])
                          total += 1
                  except Exception:
                      pass
                      
          print(f"Concluído! {total} itens foram salvos no catalogo.csv")
          PYEOF

          python3 gerar_csv.py

      - name: Salvar CSV no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add catalogo.csv
          
          # Só faz o commit se o arquivo realmente mudou
          if git diff --cached --quiet; then
            echo "O CSV não sofreu alterações."
            exit 0
          fi
          
          git commit -m "automacao: atualizar catalogo.csv"
          git push origin HEAD:main
