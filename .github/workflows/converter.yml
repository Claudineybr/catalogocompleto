name: Gerar CSV do Catalogo

on:
  schedule:
    - cron: '0 */12 * * *' # Roda a cada 12 horas
  workflow_dispatch:      # Permite rodar manualmente

permissions:
  contents: write

jobs:
  gerar-csv:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v5

      - name: Extrair dados e criar CSV
        env:
          REPO_NAME: ${{ github.repository }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          cat > gerar_csv.py << 'PYEOF'
          import json
          import re
          import csv
          import os
          from pathlib import Path

          # Pega o nome do repositório e a branch direto do GitHub Actions
          repo = os.environ.get("REPO_NAME", "Claudineybr/catalogocompleto")
          branch = os.environ.get("BRANCH_NAME", "main")

          arquivo_csv = Path('catalogo.csv')
          total = 0
          
          print("Iniciando extração dos dados...")
          
          with open(arquivo_csv, 'w', newline='', encoding='utf-8-sig') as f:
              writer = csv.writer(f, delimiter=';')
              # Cria o cabeçalho com as 3 colunas
              writer.writerow(['Nome', 'Link_Raw_GitHub', 'Link_Video_MP4'])
              
              for arq in Path('.').glob('*.json'):
                  try:
                      texto = arq.read_text(encoding='utf-8-sig')
                      
                      match = re.search(r'<script type="application/ld\+json">(.*?)</script>', texto, re.S)
                      if not match:
                          continue
                          
                      dados = json.loads(match.group(1))
                      nome = dados.get('name', '').strip()
                      link_video = dados.get('contentUrl', '').strip()
                      
                      # Monta o link Raw do GitHub dinamicamente
                      link_raw = f"https://raw.githubusercontent.com/{repo}/{branch}/{arq.name}"
                      
                      if nome and link_video:
                          writer.writerow([nome, link_raw, link_video])
                          total += 1
                  except Exception:
                      pass
                      
          print(f"Concluído! {total} itens foram salvos no catalogo.csv")
          PYEOF

          python3 gerar_csv.py

      - name: Salvar CSV no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add catalogo.csv
          
          if git diff --cached --quiet; then
            echo "O CSV não sofreu alterações."
            exit 0
          fi
          
          git commit -m "automacao: atualizar catalogo.csv"
          git push origin HEAD:main
