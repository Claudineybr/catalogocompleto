name: Auditar Arquivos (Foco no Link)

on:
  workflow_dispatch:

jobs:
  auditar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v5

      - name: Comparar Nomes com Links
        run: |
          cat > /tmp/auditar.py << 'PYEOF'
          import os, re

          arquivos = os.listdir('.')
          total_analisados = 0
          erros_encontrados = 0

          print("=== INICIANDO AUDITORIA ===")
          print("Procurando divergências entre o NOME DO ARQUIVO, o NAME e o LINK DO VÍDEO...\n")

          for arquivo in sorted(arquivos):
              if not arquivo.endswith('.json'): continue
              if any(x in arquivo for x in ['pendentes', 'fila', 'feitas', 'descartados', 'catalog', 'index']): continue
              
              # Só analisa arquivos que parecem ser de série (têm _t e e no nome)
              match_arq = re.search(r'_t(\d+)e(\d+)', arquivo, re.I)
              if not match_arq: 
                  continue
              
              total_analisados += 1
              t_arq = int(match_arq.group(1))
              e_arq = int(match_arq.group(2))
              tag_arq = f"T{t_arq}E{e_arq}"

              try:
                  with open(arquivo, 'r', encoding='utf-8') as f:
                      content = f.read()
                      
                      # Pega o NAME
                      match_name = re.search(r'"name"\s*:\s*"([^"]*)"', content)
                      nome = match_name.group(1) if match_name else "SEM NAME"
                      match_nome_tag = re.search(r'\bT(\d+)E(\d+)\b', nome, re.I)
                      tag_name = f"T{int(match_nome_tag.group(1))}E{int(match_nome_tag.group(2))}" if match_nome_tag else "SEM_TAG"

                      # Pega o LINK
                      match_url = re.search(r'"(?:contentUrl|embedUrl)"\s*:\s*"([^"]*)"', content)
                      url = match_url.group(1) if match_url else "SEM_URL"
                      
                      # Tenta extrair a Temporada/Episódio do LINK
                      tag_url = "SEM_TAG"
                      m_url = re.search(r'(\d+)x(\d+)', url)
                      if m_url: 
                          tag_url = f"T{int(m_url.group(1))}E{int(m_url.group(2))}"
                      else:
                          # Se não tiver 1x1, tenta achar T1E1 no link
                          m_url_2 = re.search(r'(?i)T(\d+)E(\d+)', url)
                          if m_url_2:
                              tag_url = f"T{int(m_url_2.group(1))}E{int(m_url_2.group(2))}"

                      # SE O LINK TIVER A TAG, ELE É A NOSSA REFERÊNCIA
                      if tag_url != "SEM_TAG":
                          if tag_arq != tag_url or tag_name != tag_url:
                              erros_encontrados += 1
                              print(f"❌ DIVERGÊNCIA NO LINK")
                              print(f"   Arquivo: {arquivo}")
                              print(f"   Link diz: {tag_url} | Name diz: {tag_name} | Arquivo diz: {tag_arq}")
                              print(f"   URL: {url}\n")
                      else:
                          # Se o link não tem a tag, compara o arquivo com o name
                          if tag_arq != tag_name:
                              erros_encontrados += 1
                              print(f"❌ DIVERGÊNCIA (LINK SEM TAG)")
                              print(f"   Arquivo: {arquivo}")
                              print(f"   Name diz: {tag_name} | Arquivo diz: {tag_arq}")
                              print(f"   URL: {url}\n")

              except Exception as e:
                  pass

          print("\n=== RESULTADO FINAL ===")
          print(f"Total de arquivos de série analisados: {total_analisados}")
          if erros_encontrados == 0:
              print("✅ PERFEITO! Nenhuma divergência encontrada. O link, o name e o arquivo batem 100%.")
          else:
              print(f"🚨 ATENÇÃO: Foram encontrados {erros_encontrados} arquivos com erro.")
              print("Role a página para cima para ver a lista de erros.")
          PYEOF
          python3 /tmp/auditar.py
