name: Extrair MP4 do Tankie e Converter

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Instalar dependencias e rodar script
        run: |
          pip install requests
          cat > script.py << 'PYEOF'
          import json
          import re
          import requests
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor

          def get_mp4_tankie(url):
              # Se não for tankie, retorna o link original
              if 'tankie.tube/videos/embed/' not in url:
                  return url
              
              vid = url.split('/')[-1]
              try:
                  r = requests.get(f"https://tankie.tube/api/v1/videos/{vid}", timeout=10)
                  if r.status_code == 200:
                      data = r.json()
                      if 'files' in data and len(data['files']) > 0:
                          return data['files'][0]['fileUrl']
              except Exception:
                  pass
              return url # Se falhar, mantém o original

          def processar(caminho):
              try:
                  texto = caminho.read_text(encoding='utf-8-sig')
                  if texto.strip().lower().startswith('<!doctype'):
                      match = re.search(r'<script type="application/ld\+json">(.*?)</script>', texto, re.S)
                      if not match: return False
                      texto = match.group(1)
                      
                  dados = json.loads(texto)
                  nome = dados.get('name', '').replace(' - 🍿Clau', '').replace(' - Clau', '').strip()
                  
                  # Pega o link original
                  url_video = dados.get('contentUrl', '')
                  # Transforma o link do Tankie em MP4 real
                  url_mp4 = get_mp4_tankie(url_video)
                  
                  dados['contentUrl'] = url_mp4
                  dados['embedUrl'] = url_mp4
                  
                  s, e, titulo, serie = 1, None, "", nome
                  m1 = re.match(r'^(.*?)\s*-\s*T(\d+)E(\d+)\s*(?:-\s*(.*))?$', nome, re.I)
                  m2 = re.match(r'^(.*?)\s*-\s*(?:Episódio|Episodio)\s*(\d+)\s*(?:-\s*(.*))?$', nome, re.I)
                  
                  if m1:
                      serie, s, e, titulo = m1.group(1).strip(), int(m1.group(2)), int(m1.group(3)), (m1.group(4) or "").strip()
                  elif m2:
                      serie, e, titulo = m2.group(1).strip(), int(m2.group(2)), (m2.group(3) or "").strip()
                      
                  if e is not None:
                      dados['name'] = f"{serie} - T{s}E{e}" + (f" - {titulo}" if titulo else "") + " - 🍿Clau"
                      dados['@type'] = "TVEpisode"
                      dados['episodeNumber'] = e
                      dados['partOfSeason'] = {"@type": "TVSeason", "seasonNumber": s}
                      dados['partOfSeries'] = {"@type": "TVSeries", "name": serie}
                  else:
                      dados['name'] = f"{nome} - 🍿Clau"
                      
                  capa = dados.get('thumbnailUrl', [''])[0]
                  if not capa:
                      capa = 'https://via.placeholder.com/500x750?text=Sem+Capa'
                      
                  json_final = json.dumps(dados, ensure_ascii=False)
                  
                  html = '<!DOCTYPE html>\n<html lang="pt-BR">\n<head>\n<script type="application/ld+json">\n' + json_final + '\n</script>\n<title>' + dados['name'] + '</title>\n<meta charset="UTF-8">\n</head>\n<body>\n<img src="' + capa + '" style="width:100%;max-height:220px;object-fit:cover;">\n<h1>' + dados['name'] + '</h1>\n</body>\n</html>'
                  
                  caminho.write_text(html, encoding='utf-8')
                  return True
              except Exception as ex:
                  return False

          arquivos = list(Path('.').glob('*.json'))
          cont = 0
          # Usa 10 threads para fazer as requisições no Tankie mais rápido
          with ThreadPoolExecutor(max_workers=10) as executor:
              resultados = list(executor.map(processar, arquivos))
              cont = sum(1 for r in resultados if r)
                  
          print(f"Arquivos processados com link MP4: {cont}")
          PYEOF

          python3 script.py

          git config user.name "Claudineybr"
          git config user.email "Claudineybr@users.noreply.github.com"
          git add .
          git commit -m "fix: extrair mp4 real do tankie e formatar HTML" || echo "Nada para commitar"
          git push origin HEAD:main
