name: Debug match definitivo

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Clonar testes
        run: |
          TMP=$(mktemp -d)
          git clone --depth 1 https://github.com/Claudineybr/testes.git "$TMP/src"
          echo "SRC_DIR=$TMP/src" >> $GITHUB_ENV

      - name: Diagnóstico
        run: |
          python3 -u << 'PYEOF'
          import os, re
          from pathlib import Path

          SRC = Path(os.environ['SRC_DIR'])

          def clean_url(u):
              if not u: return ""
              u = u.replace('\\\\n', '').replace('\\n', '')
              u = u.replace('\\\\r', '').replace('\\r', '')
              u = u.replace('\\\\t', '').replace('\\t', '')
              u = re.sub(r'[\s,]+', '', u)
              return u.lower().rstrip('/')

          def norm_protocol(u):
              return re.sub(r'^https?://', '', u)

          def extract_video(html):
              for pat in [r'"contentUrl"\s*:\s*"([^"]+)"',
                          r'<video[^>]+src=["\']([^"\']+)["\']']:
                  m = re.search(pat, html, re.I)
                  if m: return m.group(1)
              return None

          def extract_cover(html):
              for pat in [r'"thumbnailUrl"\s*:\s*(?:\[\s*)?"([^"]+)"',
                          r'<video[^>]+poster=["\']([^"\']+)["\']']:
                  m = re.search(pat, html, re.I)
                  if m:
                      v = m.group(1).strip()
                      if len(v) > 20 and v.startswith(('http://','https://')) and 'placeholder' not in v:
                          return v
              return None

          print("=" * 70)
          print("1) Procurando tt0443649 no repo testes")
          print("=" * 70)
          achados = 0
          for arq in SRC.rglob('*.html'):
              try: t = arq.read_text(encoding='utf-8', errors='ignore')
              except: continue
              if 'tt0443649' in t:
                  achados += 1
                  v = extract_video(t)
                  c = extract_cover(t)
                  print(f"\n  ARQUIVO: {arq.relative_to(SRC)}")
                  print(f"  video:   {v}")
                  print(f"  chave:   {norm_protocol(clean_url(v)) if v else None}")
                  print(f"  capa:    {c}")
                  print(f"  capa OK? {bool(c)}")
                  if achados >= 5: break
          if achados == 0:
              print("  ❌ Nenhum arquivo contém tt0443649")

          print("\n" + "=" * 70)
          print("2) Analisando 10_000_a_c_2008.html do DESTINO")
          print("=" * 70)
          dst = Path("10_000_a_c_2008.html")
          if dst.exists():
              t = dst.read_text(encoding='utf-8', errors='ignore')
              v = extract_video(t)
              print(f"  video:   {v}")
              print(f"  chave:   {norm_protocol(clean_url(v)) if v else None}")
              print(f"  tem placeholder? {'via.placeholder.com' in t}")
          else:
              print("  ❌ Arquivo não existe no destino")

          print("\n" + "=" * 70)
          print("3) Simulando o match")
          print("=" * 70)
          if dst.exists() and achados > 0:
              # pega a chave do primeiro arquivo do source que tem tt0443649
              for arq in SRC.rglob('*.html'):
                  try: t = arq.read_text(encoding='utf-8', errors='ignore')
                  except: continue
                  if 'tt0443649' in t:
                      v_src = extract_video(t)
                      k_src = norm_protocol(clean_url(v_src)) if v_src else None
                      break
              t_dst = dst.read_text(encoding='utf-8', errors='ignore')
              v_dst = extract_video(t_dst)
              k_dst = norm_protocol(clean_url(v_dst)) if v_dst else None
              print(f"  chave source: {k_src}")
              print(f"  chave destino: {k_dst}")
              print(f"  MATCH? {k_src == k_dst}")
              if k_src != k_dst and k_src and k_dst:
                  print(f"\n  ⚠️  Diferenças:")
                  print(f"     src: {repr(k_src)}")
                  print(f"     dst: {repr(k_dst)}")
          PYEOF
