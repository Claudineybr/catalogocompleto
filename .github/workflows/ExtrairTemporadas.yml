name: Debug Arrow

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: pip install requests beautifulsoup4
      - name: Testar acesso ao episódio
        run: |
          cat > debug.py << 'PYEOF'
          import requests
          import re
          from bs4 import BeautifulSoup

          url_serie = "https://www.vini7xgrave.site/2025/09/inix-arqueiro-verde-arrow-2012.html"
          headers = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"}
          
          r = requests.get(url_serie, headers=headers)
          soup = BeautifulSoup(r.text, 'html.parser')
          
          # Acha o link do Episódio 1
          link_ep = None
          for a in soup.find_all('a'):
              if 'Episódio 1' in a.text:
                  link_ep = a.get('href')
                  break
                  
          if not link_ep:
              print("Não achou o link do episódio 1.")
              exit(0)
              
          if link_ep.startswith('/'):
              link_ep = "https://www.vini7xgrave.site" + link_ep
              
          print(f"Testando URL do Episódio: {link_ep}")
          
          r_ep = requests.get(link_ep, headers=headers)
          print(f"Status Code: {r_ep.status_code}")
          print(f"Tamanho do HTML: {len(r_ep.text)} caracteres")
          
          # Verifica se achou iframe
          soup_ep = BeautifulSoup(r_ep.text, 'html.parser')
          iframes = soup_ep.find_all('iframe')
          print(f"Quantidade de iframes encontrados: {len(iframes)}")
          for i, iframe in enumerate(iframes):
              print(f"  Iframe {i+1}: {iframe.get('src')}")
              
          print("\n--- PRINT DO HTML (primeiros 1000 caracteres) ---")
          print(r_ep.text[:1000])
          PYEOF

          python3 debug.py
