name: Mega Extrair Series (Lotes de 300)

on:
  schedule:
    - cron: '*/30 * * * *' 
  workflow_dispatch:       

permissions:
  contents: write

concurrency:
  group: mega-extrator
  cancel-in-progress: false

jobs:
  extrair:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Instalar Python e Playwright
        run: |
          pip install playwright beautifulsoup4 requests
          playwright install chromium
          playwright install-deps

      - name: Extrair Itens e Retentar Falhas
        run: |
          cat > mega_extrair.py << 'PYEOF'
          import asyncio
          import re
          import json
          import requests
          import sys
          from bs4 import BeautifulSoup
          from pathlib import Path
          from playwright.async_api import async_playwright

          BASE_URL = "https://www.vini7xgrave.site"
          HEADERS = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"}
          
          ARQ_FILA = Path("series_fila.txt")
          ARQ_FEITAS = Path("series_feitas.txt")
          ARQ_PENDENTES = Path("episodios_pendentes.json")
          ARQ_DESCARTADOS = Path("episodios_descartados.txt")

          SERIES_MORTAS = ['true_detective', 'o_cuco_de_cristal', 'o11ze', 'big_bang_a_teoria']
          MAX_TENTATIVAS = 3

          def log(*args):
              print(*args, flush=True)
              sys.stdout.flush()

          if not ARQ_FILA.exists():
              log("Criando fila...")
              urls = []
              start_index = 1
              while True:
                  url_feed = f"{BASE_URL}/feeds/posts/default?alt=json&max-results=150&start-index={start_index}"
                  try:
                      r = requests.get(url_feed, headers=HEADERS, timeout=15)
                      if r.status_code != 200: break
                      data = r.json()
                      entries = data.get("feed", {}).get("entry", [])
                      if not entries: break
                      for entry in entries:
                          link = next((l["href"] for l in entry.get("link", []) if l.get("rel") == "alternate"), None)
                          if link: urls.append(link.split("?")[0])
                      start_index += 150
                      if len(entries) < 150: break
                  except: break
              ARQ_FILA.write_text("\n".join(urls), encoding="utf-8")

          feitas = set()
          if ARQ_FEITAS.exists():
              feitas = set(ARQ_FEITAS.read_text(encoding="utf-8").splitlines())

          pendentes_dict = {}
          if ARQ_PENDENTES.exists():
              try:
                  raw_pendentes = json.loads(ARQ_PENDENTES.read_text(encoding="utf-8"))
                  for p in raw_pendentes:
                      if any(morta in p.get('url', '').lower() for morta in SERIES_MORTAS): continue
                      if p['arquivo'] not in pendentes_dict:
                          pendentes_dict[p['arquivo']] = p
                      else:
                          pendentes_dict[p['arquivo']]['tentativas'] = max(
                              pendentes_dict[p['arquivo']].get('tentativas', 1),
                              p.get('tentativas', 1)
                          )
              except: pass
          
          pendentes = list(pendentes_dict.values())

          fila = [u for u in ARQ_FILA.read_text(encoding="utf-8").splitlines() if u.strip() and u not in feitas]
          lote = fila[:300]

          log(f"Faltam {len(fila)} séries. Pendentes (limpos): {len(pendentes)}.")

          async def extrair_video_playwright(context, url_ep):
              page = await context.new_page()
              capturados = []
              def on_response(res):
                  u = res.url
                  if re.search(r"[.](mp4|m3u8)([?]|$)", u, re.I) or 'tankie' in u or 'oneplayer' in u:
                      capturados.append(u)
              page.on("response", on_response)
              try:
                  await page.goto(url_ep, wait_until="domcontentloaded", timeout=20000)
                  try: await page.wait_for_selector("iframe", timeout=10000) 
                  except: pass 
                  await asyncio.sleep(3.0) 
                  html = await page.content()
                  if not capturados:
                      soup = BeautifulSoup(html, 'html.parser')
                      for iframe in soup.find_all('iframe'):
                          src = iframe.get('src', '')
                          if 'google' not in src.lower() and 'ads' not in src.lower():
                              capturados.append(src)
                  if not capturados:
                      match = re.search(r'(https?://[^"\']+(?:tankie|oneplayer)[^"\']+)', html)
                      if match: capturados.append(match.group(1))
              except Exception: pass
              finally: await page.close()
              if capturados: return list(dict.fromkeys(capturados))[0]
              return None

          def limpar_titulo_pagina(soup_title):
              if not soup_title: return "Serie Desconhecida"
              titulo = re.sub(r'^.*?-\s*', '', soup_title)
              titulo = re.sub(r'-\s*viniseries.*$', '', titulo, flags=re.I)
              titulo = titulo.split('-')[0].strip()
              return re.sub(r'\s*\d{4}$', '', titulo).strip()

          def salvar_json(nome_arquivo, nome_json, link_video):
              dados = {
                  "@context": "https://schema.org", "@type": "VideoObject",
                  "name": nome_json, "description": f"Assista {nome_json}",
                  "thumbnailUrl": ["https://via.placeholder.com/500x750?text=Sem+Capa"],
                  "uploadDate": "2020-01-01T00:00:00+00:00", "inLanguage": "pt",
                  "contentUrl": link_video, "embedUrl": link_video
              }
              json_str = json.dumps(dados, ensure_ascii=False, indent=2)
              html = f"<!DOCTYPE html>\n<html lang=\"pt-BR\">\n<head>\n<script type=\"application/ld+json\">\n{json_str}\n</script>\n<title>{nome_json}</title>\n</head>\n<body>\n<h1>{nome_json}</h1>\n</body>\n</html>"
              Path(nome_arquivo).write_text(html, encoding='utf-8')

          async def processar_serie(context, url_serie):
              if any(morta in url_serie.lower() for morta in SERIES_MORTAS):
                  log(f"\n--> [BYPASS] Ignorando série morta: {url_serie}")
                  with open(ARQ_FEITAS, "a", encoding="utf-8") as f:
                      f.write(url_serie + "\n")
                  return

              log(f"\n--> Verificando série: {url_serie}")
              try:
                  r = await asyncio.to_thread(requests.get, url_serie, headers=HEADERS, timeout=20)
                  soup = BeautifulSoup(r.text, 'html.parser')
                  
                  titulo_serie = limpar_titulo_pagina(soup.title.text if soup.title else "")
                  slug = re.sub(r'[^a-z0-9]', '_', titulo_serie.lower())
                  slug = re.sub(r'_+', '_', slug).strip('_')
                  
                  temporada_atual = 1
                  episodios = []
                  
                  for tag in soup.find_all(['b', 'h2', 'h3', 'p', 'a', 'div']):
                      texto = tag.get_text(strip=True)
                      match_temp = re.search(r'(\d+)\s*[ªº]\s*Temporada', texto, re.I)
                      if match_temp:
                          temporada_atual = int(match_temp.group(1))
                          continue
                      if tag.name == 'a' and 'episódio' in texto.lower():
                          href = tag.get('href')
                          if href:
                              if href.startswith('/'): href = BASE_URL + href
                              match_ep = re.search(r'Episódio\s*(\d+)', texto, re.I)
                              num_ep = match_ep.group(1) if match_ep else "0"
                              titulo_limpo = re.sub(r'Episódio\s*\d+\s*-?\s*', '', texto, flags=re.I).strip()
                              episodios.append({'temp': temporada_atual, 'ep': num_ep, 'titulo': titulo_limpo, 'url': href})
                              
                  with open(ARQ_FEITAS, "a", encoding="utf-8") as f:
                      f.write(url_serie + "\n")

                  if not episodios:
                      log(f"    (É um filme. Pulando...)")
                      return

                  log(f"    Encontrados {len(episodios)} episódios.")
                  
                  for item in episodios:
                      nome_arquivo = f"{slug}_t{item['temp']}e{item['ep']}.json"
                      if Path(nome_arquivo).exists(): continue
                          
                      link_video = await extrair_video_playwright(context, item['url'])
                      if not link_video: 
                          ja_existe = any(p['arquivo'] == nome_arquivo for p in pendentes)
                          if not ja_existe:
                              log(f"      [-] Falhou. Adicionando à fila de pendentes.")
                              pendentes.append({
                                  "arquivo": nome_arquivo,
                                  "nome_json": f"{titulo_serie} - T{item['temp']}E{item['ep']} - {item['titulo']} - 🍿Clau",
                                  "url": item['url'],
                                  "tentativas": 1
                              })
                          else:
                              log(f"      [-] Falhou. Já está na fila.")
                          continue
                          
                      salvar_json(nome_arquivo, f"{titulo_serie} - T{item['temp']}E{item['ep']} - {item['titulo']} - 🍿Clau", link_video)
                      log(f"      [+] Salvo: {nome_arquivo}")
                      
              except Exception as e:
                  log(f"    Erro na série {url_serie}: {e}")

          async def main():
              async with async_playwright() as pw:
                  browser = await pw.chromium.launch(headless=True)
                  context = await browser.new_context(user_agent=HEADERS["User-Agent"])
                  
                  for url in lote:
                      await processar_serie(context, url)

                  if pendentes:
                      log(f"\n=== TENTANDO NOVAMENTE {len(pendentes)} EPISÓDIOS PENDENTES ===")
                      ainda_pendentes = []
                      for item in pendentes:
                          if Path(item['arquivo']).exists(): continue
                          if any(morta in item.get('url', '').lower() for morta in SERIES_MORTAS): continue
                          
                          if item.get("tentativas", 0) >= MAX_TENTATIVAS:
                              log(f"--> [DESISTINDO E SALVANDO NO TXT] {item['arquivo']}")
                              with open(ARQ_DESCARTADOS, "a", encoding="utf-8") as f_desc:
                                  f_desc.write(f"{item['arquivo']}\t{item['url']}\t{item.get('tentativas')} falhas\n")
                              continue

                          log(f"--> Tentando ({item.get('tentativas', 1)}/{MAX_TENTATIVAS}): {item['arquivo']}")
                          link_video = await extrair_video_playwright(context, item['url'])
                          if link_video:
                              salvar_json(item['arquivo'], item['nome_json'], link_video)
                              log(f"    [+] SUCESSO AO RETENTAR: {item['arquivo']}")
                          else:
                              log(f"    [-] Ainda falhando: {item['arquivo']}")
                              item["tentativas"] = item.get("tentativas", 1) + 1
                              ainda_pendentes.append(item)
                      pendentes.clear()
                      pendentes.extend(ainda_pendentes)

                  await browser.close()

          if __name__ == "__main__":
              asyncio.run(main())
              ARQ_PENDENTES.write_text(json.dumps(pendentes, ensure_ascii=False, indent=2), encoding="utf-8")
              log(f"\nProgresso salvo. {len(pendentes)} episódios pendentes.")
          PYEOF

          python3 mega_extrair.py

      - name: Salvar arquivos e progresso
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add .
          
          if git diff --cached --quiet; then
            echo "Nada novo para commitar."
            exit 0
          fi
          
          git commit -m "feat: mega extracao (series) com retry, blacklist e cemiterio"
          
          # --- A MÁGICA ANTI-CONFLITO AQUI ---
          if ! git push origin HEAD:main; then
            echo "Push rejeitado. Sincronizando com o servidor e sobrescrevendo com os novos dados..."
            git fetch origin main
            # Mantém os arquivos locais, mas volta o HEAD para o commit remoto
            git reset --mixed origin/main
            git add .
            git commit -m "feat: mega extracao (series) - auto-merge de conflitos"
            git push origin HEAD:main
          fi
