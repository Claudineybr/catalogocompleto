name: Aplicar Capas nos JSONs (do repo testes)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Clonar testes
        run: |
          TMP=$(mktemp -d)
          git clone --depth 1 https://github.com/Claudineybr/testes.git "$TMP/src"
          echo "SRC_DIR=$TMP/src" >> $GITHUB_ENV
          echo "Arquivos no testes: $(find "$TMP/src" -name '*.html' | wc -l)"

      - name: Extrair e aplicar
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python3 -u << 'PYEOF'
          import os, re, sys
          from pathlib import Path

          PLACEHOLDER = "https://via.placeholder.com/500x750?text=Sem+Capa"
          SRC = Path(os.environ['SRC_DIR'])

          def clean(u):
              if not u: return ""
              u = u.replace('\\\\n','').replace('\\n','')
              u = u.replace('\\\\r','').replace('\\r','')
              u = u.replace('\\\\t','').replace('\\t','')
              u = re.sub(r'[\s,]+', '', u)
              return u.lower().rstrip('/')

          def key(u):
              return re.sub(r'^https?://', '', clean(u))

          def video_of(text):
              # funciona tanto pra HTML (JSON-LD) quanto pra JSON puro
              for p in [r'"contentUrl"\s*:\s*"([^"]+)"',
                        r'<video[^>]+src=["\']([^"\']+)["\']']:
                  m = re.search(p, text, re.I)
                  if m: return m.group(1)
              return None

          def cover_of(text):
              for p in [r'"thumbnailUrl"\s*:\s*(?:\[\s*)?"([^"]+)"',
                        r'<video[^>]+poster=["\']([^"\']+)["\']']:
                  m = re.search(p, text, re.I)
                  if m:
                      c = m.group(1).strip()
                      if len(c) > 20 and c.startswith(('http://','https://')) and 'placeholder' not in c:
                          return c
              return None

          # ========== 1) MAPA: URL do vídeo → capa (fonte: testes .html) ==========
          print("=" * 70)
          print("1) CONSTRUINDO MAPA DO REPO TESTES (.html)")
          print("=" * 70)
          mapa = {}
          for arq in SRC.rglob('*.html'):
              if '.git' in arq.parts: continue
              try: t = arq.read_text(encoding='utf-8', errors='ignore')
              except: continue
              v = video_of(t)
              c = cover_of(t)
              if v and c:
                  k = key(v)
                  if k and k not in mapa:
                      mapa[k] = c

          print(f"Mapa: {len(mapa)} URLs -> capa")
          k_ex = "hd5.oneplayer.site/token/fhd5/tt0443649.mp4"
          if k_ex in mapa:
              print(f"✅ tt0443649 no mapa -> {mapa[k_ex][:60]}...")
          else:
              print(f"❌ tt0443649 NÃO está no mapa do testes")

          # ========== 2) APLICA NO DESTINO (.json e .html) ==========
          print()
          print("=" * 70)
          print("2) APLICANDO NO REPO DESTINO (catalogocompleto)")
          print("=" * 70)

          total = 0
          com_ph = 0
          alterados = 0
          sem_url = 0
          sem_match = 0
          exemplo_visto = False

          # O PULO DO GATO: procura .json E .html
          for arq in sorted(Path('.').rglob('*.*')):
              if '.git' in arq.parts: continue
              if arq.suffix.lower() not in ('.json', '.html', '.htm'): continue
              
              total += 1
              try: t = arq.read_text(encoding='utf-8', errors='ignore')
              except: continue
              
              if PLACEHOLDER not in t: continue
              com_ph += 1

              v = video_of(t)
              if not v:
                  sem_url += 1
                  continue

              k = key(v)
              c = mapa.get(k)
              if not c:
                  sem_match += 1
                  if 'tt0443649' in v:
                      print(f"  ❌ {arq.name}: URL {v} NÃO está no mapa")
                  continue

              novo = t.replace(PLACEHOLDER, c)
              if novo != t:
                  arq.write_text(novo, encoding='utf-8')
                  alterados += 1
                  if 'tt0443649' in v:
                      print(f"  ✅ {arq.name} recebeu capa do tt0443649")
                      exemplo_visto = True

          if not exemplo_visto and k_ex in mapa:
              print(f"  ⚠️ tt0443649 estava no mapa, mas nenhum arquivo do destino tem essa URL")

          print()
          print("=" * 70)
          print("RESUMO")
          print("=" * 70)
          print(f"Total arquivos:   {total} (.json e .html)")
          print(f"Com placeholder:  {com_ph}")
          print(f"Alterados:        {alterados}")
          print(f"Sem video URL:    {sem_url}")
          print(f"Sem match:        {sem_match}")
          print("=" * 70)

          if alterados == 0:
              print("::error::Nenhum arquivo alterado.")
              sys.exit(1)
          PYEOF

      - name: Commit + push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          echo "=== Arquivos modificados ==="
          git diff --cached --name-only | head -20
          if git diff --cached --quiet; then
            echo "::error::git diff vazio — nada pra commitar."
            exit 1
          fi
          git commit -m "Auto: capas aplicadas nos JSONs [skip ci]"
          git push
