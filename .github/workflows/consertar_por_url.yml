name: Consertar Catálogo (Link + Nome)

on:
  workflow_dispatch: # Roda só na mão

permissions:
  contents: write

jobs:
  consertar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Corrigir temporadas e nomes
        run: |
          cat > /tmp/consertar_perfeito.py << 'PYEOF'
          import os, re, json

          arquivos = os.listdir('.')
          corrigidos = 0

          print("=== INICIANDO O CONSERTO DEFINITIVO ===")

          for arquivo in arquivos:
              if not arquivo.endswith('.json'): continue
              if any(x in arquivo for x in ['pendentes', 'fila', 'feitas', 'descartados', 'catalog', 'index']): continue
              
              try:
                  with open(arquivo, 'r', encoding='utf-8') as f:
                      content = f.read()
                      
                      # 1. A VERDADE ABSOLUTA: O Link do Vídeo (ex: 3x5.mp4)
                      url_match = re.search(r'"(?:contentUrl|embedUrl)"\s*:\s*"([^"]*)"', content)
                      if not url_match: continue
                      url = url_match.group(1)
                      
                      m_url = re.search(r'(\d+)x(\d+)', url)
                      if not m_url: continue
                          
                      temp = int(m_url.group(1))
                      ep = int(m_url.group(2))
                      tag_te = f"T{temp}E{ep}"

                      # 2. O Nome Antigo (para pegar o título do episódio)
                      match_name = re.search(r'"name"\s*:\s*"([^"]*)"', content)
                      nome_atual = match_name.group(1) if match_name else arquivo.replace('.json', '')
                      
                      # Limpa lixos e marcas
                      nome_limpo = nome_atual
                      for lixo in ['🍿Clau', '🕸️ PK', '🕸️', 'PK', '👾', 'Marcos', 'Clau', 'clau']:
                          nome_limpo = nome_limpo.replace(lixo, '')
                      
                      # Remove o T1E10 antigo e a palavra "Episódio X" para não duplicar
                      nome_limpo = re.sub(r'(?i)\bT\d+E\d+\b', '', nome_limpo)
                      nome_limpo = re.sub(r'(?i)Epis[oó]dio\s*\d+\s*[-–—]?\s*', '', nome_limpo)
                      nome_limpo = re.sub(r'\s*-\s*-\s*', ' - ', nome_limpo)
                      nome_limpo = nome_limpo.strip(' -')

                      # 3. Monta o nome perfeito
                      partes = [p.strip() for p in re.split(r'\s+[-–—]\s+', nome_limpo) if p.strip()]
                      
                      if len(partes) > 1:
                          serie_nome = partes[0]
                          ep_nome = " - ".join(partes[1:])
                          novo_nome_json = f"{serie_nome} - {tag_te} - {ep_nome} - 🍿Clau"
                      else:
                          serie_nome = partes[0] if partes else "Serie Desconhecida"
                          novo_nome_json = f"{serie_nome} - {tag_te} - 🍿Clau"

                      # Pega a capa
                      match_capa = re.search(r'"thumbnailUrl"\s*:\s*\[\s*"([^"]+)"', content)
                      capa_url = match_capa.group(1) if match_capa else "https://via.placeholder.com/500x750?text=Sem+Capa"

                      # 4. Reconstrói o JSON e renomeia o arquivo
                      novo_json = {
                          "@context": "https://schema.org", "@type": "VideoObject",
                          "name": novo_nome_json,
                          "description": f"Assista {novo_nome_json}",
                          "thumbnailUrl": [capa_url],
                          "uploadDate": "2020-01-01T00:00:00+00:00", "inLanguage": "pt",
                          "contentUrl": url, "embedUrl": url
                      }
                      
                      slug = re.sub(r'[^a-z0-9]', '_', serie_nome.lower())
                      slug = re.sub(r'_+', '_', slug).strip('_')
                      novo_arquivo = f"{slug}_{tag_te.lower()}.json"

                      with open(novo_arquivo, 'w', encoding='utf-8') as f_out:
                          json.dump(novo_json, f_out, ensure_ascii=False, indent=2)

                      # Apaga o arquivo antigo com nome errado
                      if arquivo != novo_arquivo:
                          os.remove(arquivo)

                      corrigidos += 1
                      if corrigidos % 500 == 0:
                          print(f"  -> {corrigidos} arquivos corrigidos...")

              except Exception as e:
                  print(f"Erro em {arquivo}: {e}")

          print(f"\n=== FINALIZADO! {corrigidos} arquivos consertados. ===")
          PYEOF
          python3 /tmp/consertar_perfeito.py

      - name: Salvar correções
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nada novo."; exit 0; fi
          git commit -m "fix: extrair T/E exato da URL e limpar titulo"
          
          for i in $(seq 1 5); do
            if git push origin HEAD:main; then break; fi
            git fetch origin main
            git reset --mixed origin/main
            git add -A
            git commit -m "fix: retry $i" || true
            sleep 3
          done
