name: Consertar Catálogo Definitivo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  consertar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Corrigir temporadas e nomes (Super Consertador)
        run: |
          cat > /tmp/consertar_supremo.py << 'PYEOF'
          import os, re, json

          arquivos = os.listdir('.')
          corrigidos = 0
          ignorados = 0

          print("=== INICIANDO O CONSERTO SUPREMO ===")

          for arquivo in arquivos:
              if not arquivo.endswith('.json'): continue
              if any(x in arquivo for x in ['pendentes', 'fila', 'feitas', 'descartados', 'catalog', 'index']): continue
              
              try:
                  with open(arquivo, 'r', encoding='utf-8') as f:
                      content = f.read()
                      
                      # 1. Pega a URL e a Capa
                      url_match = re.search(r'"(?:contentUrl|embedUrl)"\s*:\s*"([^"]*)"', content)
                      if not url_match: continue
                      url = url_match.group(1)
                      
                      match_capa = re.search(r'"thumbnailUrl"\s*:\s*\[\s*"([^"]+)"', content)
                      capa_url = match_capa.group(1) if match_capa else "https://via.placeholder.com/500x750?text=Sem+Capa"

                      # 2. Pega o Nome
                      match_name = re.search(r'"name"\s*:\s*"([^"]*)"', content)
                      nome_atual = match_name.group(1) if match_name else arquivo.replace('.json', '')

                      # 3. Tenta achar T/E de todas as formas possíveis
                      temp, ep = None, None
                      
                      # Tenta na URL (ex: 1x1)
                      m_url = re.search(r'(\d+)x(\d+)', url)
                      if m_url:
                          temp, ep = int(m_url.group(1)), int(m_url.group(2))
                      else:
                          # Tenta no Nome do Arquivo (ex: _t1e1)
                          m_arq = re.search(r'_t(\d+)e(\d+)', arquivo, re.I)
                          if m_arq:
                              temp, ep = int(m_arq.group(1)), int(m_arq.group(2))
                          else:
                              # Tenta no Nome do JSON (ex: T1E1)
                              m_nome = re.search(r'\bT(\d+)E(\d+)\b', nome_atual, re.I)
                              if m_nome:
                                  temp, ep = int(m_nome.group(1)), int(m_nome.group(2))

                      # Se não achou em nenhum lugar, pula (não é série ou não tem info)
                      if temp is None or ep is None:
                          ignorados += 1
                          continue

                      tag_te = f"T{temp}E{ep}"

                      # 4. Limpa o Nome Antigo (Tira lixo, T1E1, Episódio X, etc.)
                      nome_limpo = nome_atual
                      for lixo in ['🍿Clau', '🕸️ PK', '🕸️', 'PK', '👾', 'Marcos', 'Clau', 'clau']:
                          nome_limpo = nome_limpo.replace(lixo, '')
                      
                      nome_limpo = re.sub(r'(?i)\bT\d+E\d+\b', '', nome_limpo)
                      nome_limpo = re.sub(r'(?i)Epis[oó]dio\s*\d+\s*[-–—]?\s*', '', nome_limpo)
                      
                      # Arruma traços e espaços
                      nome_limpo = re.sub(r'\s+', ' ', nome_limpo)
                      nome_limpo = re.sub(r'\s*-\s*-\s*', ' - ', nome_limpo)
                      nome_limpo = nome_limpo.strip(' -')

                      partes = [p.strip() for p in re.split(r'\s+[-–—]\s+', nome_limpo) if p.strip()]
                      
                      if len(partes) > 1:
                          serie_nome = partes[0]
                          ep_nome = " - ".join(partes[1:])
                          novo_nome_json = f"{serie_nome} - {tag_te} - {ep_nome} - 🍿Clau"
                      else:
                          serie_nome = partes[0] if partes else "Serie Desconhecida"
                          novo_nome_json = f"{serie_nome} - {tag_te} - 🍿Clau"

                      # 5. Monta o JSON Novo
                      novo_json = {
                          "@context": "https://schema.org", "@type": "VideoObject",
                          "name": novo_nome_json,
                          "description": f"Assista {novo_nome_json}",
                          "thumbnailUrl": [capa_url],
                          "uploadDate": "2020-01-01T00:00:00+00:00", "inLanguage": "pt",
                          "contentUrl": url, "embedUrl": url
                      }
                      
                      slug = re.sub(r'[^a-z0-9]', '_', serie_nome.lower())
                      slug = re.sub(r'_+', '_', slug).strip('_')
                      novo_arquivo = f"{slug}_{tag_te.lower()}.json"

                      with open(novo_arquivo, 'w', encoding='utf-8') as f_out:
                          json.dump(novo_json, f_out, ensure_ascii=False, indent=2)

                      # Apaga o antigo
                      if arquivo != novo_arquivo and os.path.exists(arquivo):
                          os.remove(arquivo)

                      corrigidos += 1
                      if corrigidos % 500 == 0:
                          print(f"  -> {corrigidos} arquivos consertados...")

              except Exception as e:
                  print(f"Erro em {arquivo}: {e}")

          print(f"\n=== FINALIZADO ===")
          print(f"✅ Arquivos corrigidos e renomeados: {corrigidos}")
          print(f"⚠️ Arquivos sem info de T/E (Filmes ou quebrados): {ignorados}")
          PYEOF
          python3 /tmp/consertar_supremo.py

      - name: Salvar correções
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nada novo."; exit 0; fi
          git commit -m "fix: conserto supremo de nomes e temporadas"
          
          for i in $(seq 1 5); do
            if git push origin HEAD:main; then break; fi
            git fetch origin main
            git reset --mixed origin/main
            git add -A
            git commit -m "fix: retry $i" || true
            sleep 3
          done
